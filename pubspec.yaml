name: yomu
description: "Yomu is a free book + audiobook reader for everyone."
publish_to: "none"

version: 1.1.2+6

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.4.9
  package_info_plus: ^8.0.0
  google_fonts: ^6.1.0
  just_audio: ^0.9.36
  animations: ^2.1.1
  cached_network_image: ^3.3.0
  file_picker: ^10.3.10
  sqflite: ^2.3.0
  path: ^1.8.3
  epubx: ^4.0.0
  path_provider: ^2.1.2
  battery_plus: ^6.1.0
  http: ^1.6.0
  permission_handler: ^12.0.1
  device_info_plus: ^12.3.0
  epub_view: ^3.2.0
  intl: ^0.20.2
  pdfrx: ^2.12.1
  shared_preferences: ^2.2.2
  flutter_html: ^3.0.0-beta.2
  flutter_animate: ^4.5.2
  collection: ^1.18.0
  webview_flutter: ^4.13.1
  receive_sharing_intent:
    git:
      url: https://github.com/KasemJaffer/receive_sharing_intent
      ref: 2cea396843cd3ab1b5ec4334be4233864637874e
  crypto: ^3.0.7
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.1
  url_launcher: ^6.3.2
  tutorial_coach_mark: ^1.3.3
  share_plus: ^12.0.1
  android_intent_plus: ^6.0.0
  image: ^4.8.0
  flutter_quill: ^11.6.0
  markdown_quill: ^4.3.0
  markdown: ^7.2.2
  record: ^7.1.1
  archive: ^4.0.9

dependency_overrides:
  # epubx 4.0.0 on pub.dev is pinned to image 3; upstream's unreleased 4.0.1
  # moves to image 4, which pdfrx 2.12 requires.
  epubx:
    git:
      url: https://github.com/rbcprolabs/epubx.dart
      ref: 1c0347b20c9123866bff760f8571ec50fefb037d
  # epubx still declares archive ^3, but the archive APIs it uses are unchanged
  # in archive 4, which pdfrx 2.12 requires.
  archive: ^4.0.9
  # flutter_html 3.0.0 imports html internals that were removed in 0.15.7.
  html: 0.15.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
flutter:
  uses-material-design: true

  assets:
    - assets/
